[build-system]
requires = ["uv_build==0.12.5"]
build-backend = "uv_build"

[project]
name = "harness"
version = "0.1.0.dev0"
description = "Local-first control plane for coding agents"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "ast-grep-py==0.45.1",
    "mcp==2.0.0",
]

[project.scripts]
harness = "harness.entrypoints:harness_main"
harnessd = "harness.entrypoints:harnessd_main"

[dependency-groups]
dev = [
    "mypy==2.3.0",
    "pytest==9.0.3",
    "ruff==0.16.3",
    "uv-build==0.12.5",
]

[tool.uv]
required-version = "==0.12.5"

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "RUF"]

[tool.ruff.lint.per-file-ignores]
"**/dashboard_i18n.py" = ["RUF001"]
"**/dashboard_assets.py" = ["RUF001"]
"**/test_dashboard*.py" = ["RUF001"]
"**/search_text.py" = ["RUF001"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-config", "--strict-markers"]
