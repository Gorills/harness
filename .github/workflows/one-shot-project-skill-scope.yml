name: One-shot project skill scope materialization

on:
  push:
    branches:
      - feature/project-skill-scope

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: feature/project-skill-scope

      - name: Apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/project-skill-scope.patch.gz.b64 > /tmp/project-skill-scope.patch.gz
          echo '566da083029e6369db6ccb76dcc1cdfef7d01c19eb7be5de1bf24821d471d9bc  /tmp/project-skill-scope.patch.gz' | sha256sum --check --strict
          gzip --decompress --stdout /tmp/project-skill-scope.patch.gz > /tmp/project-skill-scope.patch
          git apply --check /tmp/project-skill-scope.patch
          git apply /tmp/project-skill-scope.patch
          rm -f .github/skill-policy-orig-01
          rm -f .github/skill-policy-payload-00
          rm -f .github/skill-policy-payload-01
          rm -f .github/project-skill-scope.patch.gz.b64
          rm -f .github/workflows/one-shot-project-skill-scope.yml
          git diff --check
          python -m py_compile src/harness/skill_policy.py src/harness/skills.py src/harness/skill_runtime.py src/harness/dashboard.py src/harness/storage.py

      - name: Commit product changes and remove transport
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add project-level skill scope controls'
          git push origin HEAD:feature/project-skill-scope
