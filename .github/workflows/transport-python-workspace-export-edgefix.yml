name: Transport Python workspace export edgefix

on:
  push:
    branches:
      - feature/search-v2-python-workspace-export-validation
    paths:
      - .transport/python-workspace-export-edgefix.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/search-v2-python-workspace-export-validation
          fetch-depth: 0
      - name: Verify and apply edgefix
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .transport/python-workspace-export-edgefix.b64 > /tmp/edgefix.patch.gz
          echo '7a8fc72915dba0f82d3609cf65f48edacb6328807ff7f0376f226d6e0fbdc9d2  /tmp/edgefix.patch.gz' | sha256sum -c -
          gzip -dc /tmp/edgefix.patch.gz > /tmp/edgefix.patch
          echo '1d72030a926a67e221ab097255e8b03cbd5a8b61883d391a89c2a3b2e8eeed91  /tmp/edgefix.patch' | sha256sum -c -
          git apply --check /tmp/edgefix.patch
          git apply /tmp/edgefix.patch
          rm -rf .transport .github/workflows/transport-python-workspace-export-edgefix.yml
          git diff --check
          python -m compileall -q src/harness tests/test_search_v2_symbol_navigation.py
      - name: Commit clean feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: validate pure relative imports against package init'
          test -z "$(git status --porcelain)"
          if git ls-tree -r --name-only HEAD | grep -E '^(\.transport/|\.github/workflows/transport-python-workspace-export-edgefix\.yml$)'; then
            exit 1
          fi
          git push origin HEAD:feature/search-v2-python-workspace-export-validation
