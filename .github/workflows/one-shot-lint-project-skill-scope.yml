name: One-shot project skill scope lint repair

on:
  push:
    branches:
      - feature/project-skill-scope

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feature/project-skill-scope
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.5

      - name: Repair only CI-reported lint
        shell: bash
        run: |
          set -euo pipefail
          uv python install 3.13
          uv sync --locked --all-groups
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/test_skill_relevance_reconciliation.py')
          text = path.read_text(encoding='utf-8')
          old = '        assert "<strong>Frontend</strong><span>Не использовать" in html\n'
          new = '        assert "<strong>Frontend</strong><span" in html\n        assert \'data-mode="excluded"\' in html\n'
          if old not in text:
              raise SystemExit('expected mixed-script assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          uv run --frozen ruff check --fix tests/test_index_reconcile_provenance.py tests/test_skill_relevance_reconciliation.py
          uv run --frozen ruff format tests/test_index_reconcile_provenance.py tests/test_skill_relevance_reconciliation.py
          uv run --frozen ruff check tests/test_index_reconcile_provenance.py tests/test_skill_relevance_reconciliation.py
          rm -f .github/workflows/one-shot-lint-project-skill-scope.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Fix project skill scope lint'
          git push origin HEAD:feature/project-skill-scope
