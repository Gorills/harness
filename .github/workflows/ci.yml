name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false

      - name: Archive exact PR source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git archive \
            --format=tar.gz \
            --prefix=harness/ \
            --output="$RUNNER_TEMP/harness-source-$PR_HEAD_SHA.tar.gz" \
            HEAD

      - name: Upload exact PR source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/harness-source-${{ github.event.pull_request.head.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact quality candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.pull_request.number) || github.sha }}

      - name: Verify quality checkout identity
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Run quality gate
        run: uv run --frozen python scripts/quality.py

      - name: Build offline PR toolchain bundle
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          offline_cache="$RUNNER_TEMP/harness-offline-uv-cache"
          offline_venv="$RUNNER_TEMP/harness-offline-venv"
          bundle_dir="$RUNNER_TEMP/harness-toolchain"
          rm -rf "$offline_cache" "$offline_venv" "$bundle_dir"
          mkdir -p "$bundle_dir"
          UV_CACHE_DIR="$offline_cache" \
          UV_PROJECT_ENVIRONMENT="$offline_venv" \
            uv sync --locked --all-groups --no-install-project
          cp "$(command -v uv)" "$bundle_dir/uv"
          chmod 0755 "$bundle_dir/uv"
          tar --format=posix -czf "$bundle_dir/uv-cache.tar.gz" -C "$offline_cache" .
          tar --format=posix \
            -czf "$RUNNER_TEMP/harness-toolchain-$PR_HEAD_SHA.tar.gz" \
            -C "$bundle_dir" \
            uv uv-cache.tar.gz

      - name: Upload offline PR toolchain bundle
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-toolchain-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/harness-toolchain-${{ github.event.pull_request.head.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0


  exact-tree-transport-publish:
    if: github.event_name == 'pull_request' && github.head_ref == 'transport/quality-discipline-20260828'
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact transport PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false

      - name: Verify and assemble content-addressed patch
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PATCH_SHA256: 6f157bb3350557c471c0a3717a39d9f708cdad0ded3cd7f394ff60fb03a9549d
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          cat .harness-transport/part-*.patch > "$RUNNER_TEMP/candidate.patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$RUNNER_TEMP/candidate.patch" | sha256sum -c -

      - name: Check out exact canonical base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 2dc1c4ead544bbfa134ff5ceee8aaec401d1cec6
          path: candidate
          persist-credentials: false

      - name: Reconstruct verified tree and publish feature branch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA: 2dc1c4ead544bbfa134ff5ceee8aaec401d1cec6
          EXPECTED_TREE: 697e8f0ee80da603a07a93681bd4360da2842a2f
          FEATURE_BRANCH: feat/quality-discipline-verification
        run: |
          set -euo pipefail
          cd candidate
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git apply --index "$RUNNER_TEMP/candidate.patch"
          git diff --cached --check
          test "$(git write-tree)" = "$EXPECTED_TREE"
          python scripts/publish_git_data.py publish \
            --repo "$GITHUB_REPOSITORY" \
            --base main \
            --branch "$FEATURE_BRANCH" \
            --message "Implement Harness quality discipline and verification"
