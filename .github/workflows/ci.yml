name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  source-snapshot:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          persist-credentials: false

      - name: Archive exact PR source
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$PR_HEAD_SHA"
          git archive \
            --format=tar.gz \
            --prefix=harness/ \
            --output="$RUNNER_TEMP/harness-source-$PR_HEAD_SHA.tar.gz" \
            HEAD

      - name: Upload exact PR source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-source-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/harness-source-${{ github.event.pull_request.head.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

  quality:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true

      - name: Install Python 3.13
        run: uv python install 3.13

      - name: Sync locked environment
        run: uv sync --locked --all-groups

      - name: Run quality gate
        run: uv run --frozen python scripts/quality.py
