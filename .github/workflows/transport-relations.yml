name: Transport persistent relations

on:
  push:
    branches:
      - feature/search-v2-persistent-relations
    paths:
      - .transport/ready

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact transport commit
        uses: actions/checkout@v4
        with:
          ref: feature/search-v2-persistent-relations
          fetch-depth: 0
      - name: Reconstruct and apply verified patch
        shell: bash
        run: |
          set -euo pipefail
          cat .transport/rel-*.b64 | tr -d '\n' | base64 -d | gzip -d > /tmp/search-v2-relations.patch
          git apply --check /tmp/search-v2-relations.patch
          git apply /tmp/search-v2-relations.patch
          rm -rf .transport .github/workflows/transport-relations.yml
          git diff --check
          python -m compileall -q src/harness tests/test_search_v2_code_relations.py tests/test_search_v2_code_units.py
      - name: Commit clean feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          if git diff --cached --name-only | grep -E '^(\.transport/|\.github/workflows/transport-relations\.yml$)'; then
            echo 'transport files unexpectedly remain staged' >&2
            exit 1
          fi
          git commit -m 'feat: persist Search v2 syntactic relations'
          test -z "$(git status --porcelain)"
          if git ls-tree -r --name-only HEAD | grep -E '^(\.transport/|\.github/workflows/transport-relations\.yml$)'; then
            echo 'transport files unexpectedly remain in final tree' >&2
            exit 1
          fi
          git push origin HEAD:feature/search-v2-persistent-relations
