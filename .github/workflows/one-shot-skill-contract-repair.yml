name: One-shot skill contract repair

on:
  push:
    branches:
      - improve/native-skill-quality

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repair candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: improve/native-skill-quality
          fetch-depth: 0

      - name: Apply bounded repair and remove workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          for name in (
              "src/harness/builtin_skills.py",
              "tests/test_builtin_skills.py",
              "tests/test_skills.py",
          ):
              path = Path(name)
              data = path.read_bytes()
              path.write_bytes(data.rstrip(b"\n") + b"\n")

          replacements = {
              "ARCHITECTURE.md": [
                  (
                      "Canonical Harness skill registry lives outside repositories. Runtime load, built-in sync, doctor, and purge preflight share one fail-closed local filesystem-trust check: an existing registry root must be a real current-user directory without group or other write; missing roots stay empty or skip, unsafe existing roots are refused rather than chmod'd, and prepare also requires the immediate parent to meet that same owner/write contract (custom `HARNESS_SKILL_REGISTRY` ancestor replacement is out of v1). The resolver selects a relevant subset using deterministic project stack and explicit include/exclude configuration. Harness ships a compact built-in quality pack of 16 skills into that registry through ownership-aware reconciliation; the default model-visible budget is 14. Six cores apply to every detected software project: `testing-strategy`, `secure-by-design`, `project-architecture`, `complex-change-planning`, `language-engineering`, and `legacy-preservation`. The built-ins are intent-oriented, composed through stack applicability, and validated against supported host surfaces; no second workflow/composition DSL is introduced. Detailed Docker, frontend discoverability, language-native, mobile, server, game, operations, and security guidance uses portable nested `references/` that the selected skill routes to only when relevant. The canonical pack may exceed the model-visible budget; the resolver still projects at most the configured bounded subset. Same-id unknown or user-modified canonical content, including nested reference content, is never overwritten.",
                      "Canonical Harness skill registry lives outside repositories. Runtime load, built-in sync, doctor, and purge preflight share one fail-closed local filesystem-trust check: an existing registry root must be a real current-user directory without group or other write; missing roots stay empty or skip, unsafe existing roots are refused rather than chmod'd, and prepare also requires the immediate parent to meet that same owner/write contract (custom `HARNESS_SKILL_REGISTRY` ancestor replacement is out of v1). The resolver selects every relevant Skill using deterministic project stack and explicit include/exclude configuration. Harness ships a compact built-in quality pack of 16 skills into that registry through ownership-aware reconciliation. Six cores apply to every detected software project: `testing-strategy`, `secure-by-design`, `project-architecture`, `complex-change-planning`, `language-engineering`, and `legacy-preservation`. The built-ins are intent-oriented, composed through stack applicability, and validated against supported host surfaces; no second workflow/composition DSL is introduced. Detailed Docker, frontend discoverability, language-native, mobile, server, game, operations, and security guidance uses portable nested `references/` that the selected skill routes to only when relevant. All stack-matching Skills are projected; deterministic match strength may order them but never drops a relevant Skill because of a count cap. Same-id unknown or user-modified canonical content, including nested reference content, is never overwritten.",
                  )
              ],
              "docs/specification.md": [
                  (
                      "Количество canonical built-ins не равно model-visible budget: resolver по-прежнему выбирает только\nрелевантный bounded subset. Подробные stack/domain инструкции могут жить в portable\n`references/` и должны читаться skill'ом только для затронутого языка или режима. Quality pack",
                      "Resolver materialize'ит каждый Skill, релевантный detected project stack или явно включённый\nproject policy; количественного model-visible cap нет. Нерелевантные Skills в Project не попадают.\nПодробные stack/domain инструкции могут жить в portable `references/` и должны читаться skill'ом\nтолько для затронутого языка или режима. Quality pack",
                  ),
                  (
                      "# 81. Skill budget\n\nКоличество model-visible Harness skills ограничено.\n\nDesign target:\n\n```text\nоколо 12 или меньше\n\n```\n\nна project по умолчанию.\n\nЭто configurable policy, а не protocol constant.",
                      "# 81. Skill visibility\n\nProject видит все Skills, релевантные detected Workspace stack или явно включённые project policy,\nкроме явно исключённых. Количественного model-visible budget нет: порядок может быть\nдетерминирован relevance, но не должен отбрасывать matching Skill.\n\nЭто не отменяет response budgets MCP: Skill files materialize'ятся через native host surface и\nчитаются host'ом по progressive disclosure, а не выдаются одним model-context payload.",
                  ),
              ],
              "docs/decisions/0041-task-skill-session-delivery.md": [
                  (
                      "4. **What happens on skill budget overflow?**\n   Unchanged: the resolver projects at most the configured bounded subset. Skills that do\n   not win the budget are not projected and are not delivered through MCP. Overflow is a\n   next-boundary projection outcome, not a current-session MCP fallback.",
                      "4. **What happens when many Skills match the project?**\n   [ADR-0044](0044-project-skill-projection-has-no-count-cap.md) supersedes the former overflow\n   rule: every matching Skill is projected. MCP still does not deliver Skill bodies; the host\n   chooses which projected Skill to load through native discovery/progressive disclosure.",
                  )
              ],
              "docs/decisions/0042-project-stack-skill-selection.md": [
                  (
                      "- The built-in catalog no longer depends on Task hints for usefulness. The pack has 16 built-ins;\n  the default visible budget is 14 (`DEFAULT_MAX_VISIBLE_SKILLS`). Six cores apply to every\n  detected software project: `testing-strategy`, `secure-by-design`, `project-architecture`,\n  `complex-change-planning`, `language-engineering`, and dedicated `legacy-preservation`.\n  Specialized Task-only skills were merged into those cores or retired. Built-in `harness.yaml`\n  does not emit `task_hints`.",
                      "- The built-in catalog no longer depends on Task hints for usefulness. The pack has 16 built-ins.\n  Six cores apply to every detected software project: `testing-strategy`, `secure-by-design`,\n  `project-architecture`, `complex-change-planning`, `language-engineering`, and dedicated\n  `legacy-preservation`. Specialized Task-only skills were merged into those cores or retired.\n  Built-in `harness.yaml` does not emit `task_hints`. The count-based visibility budget originally\n  recorded here is superseded by [ADR-0044](0044-project-skill-projection-has-no-count-cap.md).",
                  )
              ],
          }

          for name, pairs in replacements.items():
              path = Path(name)
              text = path.read_text(encoding="utf-8")
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f"expected exactly one replacement in {name}, got {count}")
                  text = text.replace(old, new)
              path.write_text(text, encoding="utf-8")
          PY

          rm .github/workflows/one-shot-skill-contract-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/harness/builtin_skills.py tests/test_builtin_skills.py tests/test_skills.py ARCHITECTURE.md docs/specification.md docs/decisions/0041-task-skill-session-delivery.md docs/decisions/0042-project-stack-skill-selection.md .github/workflows/one-shot-skill-contract-repair.yml
          git diff --cached --check
          git commit -m "Align skill visibility contract and formatting"
          git push origin HEAD:improve/native-skill-quality
