name: Transport Python workspace export validation

on:
  push:
    branches:
      - feature/search-v2-python-workspace-export-validation
    paths:
      - .transport/python-workspace-export-validation.b64

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out transport head
        uses: actions/checkout@v4
        with:
          ref: feature/search-v2-python-workspace-export-validation
          fetch-depth: 0
      - name: Verify and apply patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .transport/python-workspace-export-validation.b64 > /tmp/python-workspace-export-validation.patch.gz
          echo 'fff8cc64b3888a6af0cb02abab0d475ac43dad62a1eb5b387eed987cdd440ce9  /tmp/python-workspace-export-validation.patch.gz' | sha256sum -c -
          gzip -dc /tmp/python-workspace-export-validation.patch.gz > /tmp/python-workspace-export-validation.patch
          echo '308a2c91a8cd18e9881eb9a5c1754f2dc7e582adc1f1aac25764feb7aa1d24de  /tmp/python-workspace-export-validation.patch' | sha256sum -c -
          git apply --check /tmp/python-workspace-export-validation.patch
          git apply /tmp/python-workspace-export-validation.patch
          rm -rf .transport .github/workflows/transport-python-workspace-export-validation.yml
          git diff --check
          python -m compileall -q src/harness tests/test_search_v2_symbol_navigation.py
      - name: Commit clean feature tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat: validate Python workspace exports in symbol navigation'
          test -z "$(git status --porcelain)"
          if git ls-tree -r --name-only HEAD | grep -E '^(\.transport/|\.github/workflows/transport-python-workspace-export-validation\.yml$)'; then
            echo 'transport files unexpectedly remain in final tree' >&2
            exit 1
          fi
          git push origin HEAD:feature/search-v2-python-workspace-export-validation
