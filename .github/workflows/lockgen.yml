name: Temporary MCP lock generation

on:
  pull_request:

permissions:
  contents: read

jobs:
  lockgen:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Generate MCP v2 lock
        run: uv add "mcp==2.0.0" --no-sync

      - name: Bundle generated dependency files
        run: tar -czf "$RUNNER_TEMP/harness-mcp-lock.tar.gz" pyproject.toml uv.lock

      - name: Upload generated dependency files
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: harness-mcp-lock-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/harness-mcp-lock.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
