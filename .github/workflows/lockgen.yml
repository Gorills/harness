name: Temporary MCP lock generation

on:
  pull_request:

permissions:
  contents: write

jobs:
  lockgen:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out target feature branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/mcp-v2-bridge

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"

      - name: Finalize target dependency lock
        run: |
          uv lock
          rm .github/workflows/feature-lockgen.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock .github/workflows/feature-lockgen.yml
          git commit -m "chore: finalize MCP dependency lock"
          git push origin HEAD:feat/mcp-v2-bridge
